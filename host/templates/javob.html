{% extends 'base.html' %}

{% block content %}
<section class="w-full max-w-[1200px] mx-auto mt-[40px] md:mt-[60px] text-center">
    <div class="bg-[#1e293b] border-[1px] border-white/20 rounded-[20px] p-[30px] md:p-[40px] w-[90%] max-w-[600px] mx-auto mb-[30px]">
        <h1 class="text-[36px] md:text-[44px] font-bold text-[#a78bfa] mb-[20px]">Natijangiz</h1>
        
        <div class="text-left">
            <p class="text-[22px] md:text-[26px] mb-[12px] text-white/80">To'g'ri javoblar: <span class="text-[#facc15] font-bold">{{ correct }}</span> / {{ total }}</p>
            <p class="text-[28px] md:text-[32px] mb-[25px] text-white/80">Foiz: <span class="text-[#facc15] font-bold">{{ percentage }}%</span></p>
        </div>
        
        <hr class="border-white/10 my-[20px]">

        <div class="text-[18px] md:text-[20px] text-left">
            <p class="mb-[10px]"><strong class="text-white/70">Boshlangan vaqti:</strong> <span class="text-[#facc15]">{{ start_time }}</span></p>
            <p class="mb-[10px]"><strong class="text-white/70">Tugallangan vaqti:</strong> <span class="text-[#facc15]">{{ end_time }}</span></p>
            <p><strong class="text-white/70">Sarf qilingan vaqt:</strong> <span class="text-[#facc15]">{{ duration }}</span></p>
        </div>
    </div>
    
    <a class="inline-block bg-[#6366f1] border-[2px] border-white/20 px-[30px] py-[14px] text-[22px] md:text-[26px] text-white rounded-full"
        href="{% url 'savollar' %}">
        Qayta topshirish
    </a>
</section>
{% endblock %}
